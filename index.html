<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<script>
  // 1rem = 10px su uno schermo largo 1920: tutto scala con lo schermo (prima del primo disegno).
  document.documentElement.style.fontSize = (10 * Math.min((window.innerWidth || 1920) / 1920, (window.innerHeight || 1080) / 1080)) + 'px';
  try { var t = JSON.parse(localStorage.getItem('tvh-prefs') || '{}').tema; if (t) document.documentElement.setAttribute('data-tema', t); } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600;700&display=swap">
<link rel="stylesheet" href="home.css">
</head>
<body>
  <div id="ambient"><div class="wash on" id="wash-a"></div><div class="wash" id="wash-b"></div></div>

  <header id="topbar">
    <div id="greeting">Buonasera</div>
    <div id="topright">
      <span id="date"></span><span id="time"></span><span class="iconbtn" id="gear" title="Impostazioni">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M27.6 4l.9 5.1c1.2.4 2.4 1.1 3.4 1.9l4.9-1.8 3.6 6.2-4 3.3c.2 1.3.2 2.6 0 3.9l4 3.3-3.6 6.2-4.9-1.8c-1 .8-2.2 1.5-3.4 1.9l-.9 5.1h-7.2l-.9-5.1c-1.2-.4-2.4-1.1-3.4-1.9l-4.9 1.8-3.6-6.2 4-3.3a12 12 0 0 1 0-3.9l-4-3.3 3.6-6.2 4.9 1.8c1-.8 2.2-1.5 3.4-1.9L20.4 4zM24 17a7 7 0 1 0 0 14 7 7 0 0 0 0-14z" transform="translate(0 2)"/></svg>
      </span>
    </div>
  </header>

  <section id="hero">
    <div class="hero-text" id="hero-text">
      <div id="hero-cap"></div>
      <h1 id="hero-title">Home</h1>
      <p id="hero-sub">&nbsp;</p>
      <div id="hero-chips"></div>
    </div>
  </section>

  <main id="rows"></main>

  <div id="settings">
    <div id="settings-head">
      <h1>Impostazioni</h1>
      <p>Frecce per scegliere, OK per cambiare, Indietro per tornare alla home. Tutto viene salvato sul TV.</p>
    </div>
    <div id="settings-list"></div>
  </div>

  <div id="pair"></div>
  <div id="sheet"></div>
  <div id="editor"></div>
  <div id="toast"></div>

  <script src="profilo.js"></script>
  <script src="ui.js"></script>
  <script>UI.fitScreen(); window.addEventListener('resize', UI.fitScreen);</script>
  <script src="home.js"></script>
</body>
</html>
